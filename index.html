<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Abra sua Conta - Agibank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-cadastro">
        <h2>Seja bem-vindo ao Agibank</h2>
        <p>Preencha os dados abaixo para criar sua conta digital gratuita.</p>
        
        <form>
            <label>Nome Completo</label>
            <input type="text" placeholder="Digite seu nome">

            <label>CPF</label>
            <input type="text" placeholder="000.000.000-00">

            <label>E-mail</label>
            <input type="email" placeholder="seuemail@uol.com">

            <button type="button">Criar Minha Conta</button>
        </form>
    </div>
</body>
</html>
